services:

  frontend:
    build: ./frontend
    container_name: news-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - news-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: news-backend
    ports:
      - "${BACKEND_PORT}:5000"
    env_file:
      - backend.env
    depends_on:
      - mongo
    networks:
      - news-network
    restart: unless-stopped

  mongo:
    # image: mongo:6 # use this version on windows
    image: mongo:4.4.18
    container_name: news-mongo
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - news-network
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  news-network: