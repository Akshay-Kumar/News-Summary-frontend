server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # ✅ Fix XML serving
    location ~* \.xml$ {
        try_files $uri =404;
        default_type application/xml;
        add_header Content-Type application/xml;
    }

    # ✅ React SPA fallback (keep LAST)
    location / {
        try_files $uri /index.html;
    }
}